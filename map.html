<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Map - Saudi Developers Database</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <nav>
        <a href="index.html">Developers</a>
        <a href="projects.html">Projects</a>
        <a href="map.html" class="active">Map</a>
        <a href="units.html">Units</a>
        <a href="#" onclick="openDocuments(); return false;">Documents</a>
    </nav>
    
    <div class="map-container">
        <div class="map-sidebar" id="mapSidebar">
            <div class="sidebar-header">
                <h2>Projects Map</h2>
                <div class="map-stats">
                    <span id="projectsOnMap">0</span> projects on map
                </div>
                <div class="search-bar">
                    <input type="text" id="mapSearch" placeholder="Filter projects...">
                </div>
                <div class="filter-group">
                    <select id="mapStatusFilter">
                        <option value="">All Statuses</option>
                        <option value="planned">Planned</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="ready">Ready</option>
                    </select>
                    <select id="mapTypeFilter">
                        <option value="">All Types</option>
                    </select>
                </div>
            </div>
            <div class="sidebar-projects" id="sidebarProjectsList"></div>
        </div>
        
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
        
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
    </div>
    
    <div id="projectModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <div id="projectDetails"></div>
        </div>
    </div>
    
    <script>
        function openDocuments() {
            window.open('https://drive.google.com/drive/folders/1HSmp1l5AyGOywzB0rxsfSB-VmbSFmxH_?usp=drive_link', '_blank');
        }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/csv-loader.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
